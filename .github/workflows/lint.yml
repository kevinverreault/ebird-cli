name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Install the Ruff version pinned in requirements-dev.txt so CI matches local runs
      - name: Install Ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff check
        run: ruff check --output-format=github

      - name: Ruff format
        run: ruff format --check
