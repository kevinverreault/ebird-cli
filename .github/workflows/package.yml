name: Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Install the build version pinned in requirements-dev.txt so CI matches local runs
      - name: Install build
        run: pip install "$(grep '^build~=' requirements-dev.txt)"

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the wheel into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl

      # Run from outside the checkout so only the installed package can be imported
      - name: Launch ebird-cli
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/ebird-cli --help
          venv/bin/ebird-cli --version
